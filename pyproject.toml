[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthfin-aml"
version = "9.2.0"
description = "Generate realistic synthetic transaction graphs with injected AML patterns for training Graph Neural Networks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["aml", "fraud-detection", "gnn", "synthetic-data", "graph-neural-network", "anti-money-laundering", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "numba>=0.56",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.0.0",
    "torch_geometric>=2.3.0",
    "datasets",
    "networkx"
]
ml = [
    "polars>=1.0",
    "lightgbm",
    "scikit-learn",
    "pyarrow"
]
dev = ["pytest>=7.0", "psutil"]

[project.urls]
Homepage = "https://github.com/valiyevoktay-cmd/synthfin-aml-"
Documentation = "https://github.com/valiyevoktay-cmd/synthfin-aml-#readme"
Issues = "https://github.com/valiyevoktay-cmd/synthfin-aml-/issues"

[tool.setuptools.packages.find]
include = ["synthfin_aml_pkg*"]
